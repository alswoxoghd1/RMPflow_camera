rmpflow_controller:
  ros__parameters:
    # Evaluate and log the complete current TG-RMP policy without contributing
    # its metric/force to the root.  Compare this run with off and conservative
    # using the same Diffusion Policy episode.
    enable_tangent_escape_rmp: true
    tg_rmp_observe_only: true
    publish_tangent_escape_rmp_data: true
    publish_tangent_escape_dual_solve_data: false
    publish_tangent_escape_geometry_debug: false

    # Explicit snapshot of the current 2026-08-28 TG tuning.
    tangent_escape_rmp_clearance_margin: 0.0
    tg_rmp_owner_hysteresis: 0.005
    tg_rmp_alpha_on_distance: 0.15
    tg_rmp_alpha_off_distance: 0.45
    tg_rmp_block_on_dot: 0.0
    tg_rmp_block_off_dot: 0.3
    tg_rmp_nominal_motion_epsilon: 0.001
    tg_rmp_nominal_filter_tau: 0.15
    tg_rmp_pocket_length: 0.06
    tg_rmp_pocket_threshold: 0.6
    tg_rmp_pocket_epsilon: 0.1
    tg_rmp_direction_rate: 1.5
    tg_rmp_weight_goal: 0.6
    tg_rmp_weight_continuity: 1.0
    tg_rmp_weight_risk: 0.5
    tg_rmp_weight_axis: 0.4
    tg_rmp_risk_length: 0.15
    tg_rmp_axial_preference: 1.0
    tg_rmp_weight_axial_block: 0.0
    tg_rmp_weight_i1: 1.0
    tg_rmp_i1_length: 0.10
    tg_rmp_i1_damping: 0.05
    tg_rmp_i1_exclude_parent_link: true
    tg_rmp_weight_stall: 0.0
    tg_rmp_stall_time_constant: 1.5
    tg_rmp_stall_speed: 0.005
    tg_rmp_use_obstacle_motion: true
    tg_rmp_clearance_rate_filter_tau: 0.05
    tg_rmp_clearance_rate_deadband: 0.005
    tg_rmp_accel_gain: 500.0
    tg_rmp_accel_length: 0.08
    tg_rmp_accel_saturation: 800.0
    tg_rmp_closing_gain: 500.0
    tg_rmp_closing_length: 0.05
    tg_rmp_closing_epsilon: 0.1
    tg_rmp_closing_rate_scale: 0.05
    tg_rmp_tangent_damping: 40.0
    tg_rmp_enable_progress_attenuation: false
    tg_rmp_progress_scale: 1.0
    tg_rmp_progress_recovery_time: 3.0
    tg_rmp_metric_mu: 10000.0
    tg_rmp_metric_length: 0.03
    tg_rmp_metric_epsilon: 0.1
    tg_rmp_metric_rate_scale: 0.05

    publish_rmp_accel_debug: true
    publish_rmp_ee_pose: true
    publish_debug_state: true
    publish_target_metric: true
    publish_control_timing_debug: true

proximity_obstacle_bridge:
  ros__parameters:
    publish_rate: 200.0
    trigger_distance: 0.45

rmpflow_bridge:
  ros__parameters:
    goal_filter_enabled: true
    goal_filter_rate_hz: 200.0
    goal_filter_time_constant_s: 0.08
    goal_filter_max_linear_speed_m_s: 0.30
    goal_filter_max_angular_speed_rad_s: 1.0
